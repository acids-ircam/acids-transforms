# Builds the documentation on every push and pull request, so broken docs are caught before Read the Docs builds them.
# Read the Docs itself builds and hosts the docs through its GitHub integration (see .readthedocs.yaml).
name: docs

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install .
      - name: Build HTML
        run: sphinx-build -b html --keep-going -W docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
